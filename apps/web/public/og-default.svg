<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent line -->
  <rect x="80" y="280" width="80" height="4" rx="2" fill="url(#accent)" />

  <!-- Name -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white" letter-spacing="-1">
    Taas S. Ekpaye
  </text>

  <!-- Title -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.6)" font-weight="400">
    Software Developer
  </text>

  <!-- Tagline -->
  <text x="80" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.4)">
    Full-stack web &amp; mobile applications
  </text>

  <!-- Decorative dots -->
  <circle cx="1050" cy="150" r="100" fill="rgba(59,130,246,0.08)" />
  <circle cx="1100" cy="200" r="60" fill="rgba(139,92,246,0.06)" />
  <circle cx="1000" cy="100" r="40" fill="rgba(59,130,246,0.05)" />
</svg>
